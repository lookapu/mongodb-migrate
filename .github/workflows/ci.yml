name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  executable:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pyinstaller --clean --noconfirm mongo_migrate.spec
      - if: runner.os == 'Windows'
        run: pyinstaller --clean --noconfirm mongo_migrate_windows_gui.spec
      - if: runner.os == 'macOS'
        run: pyinstaller --clean --noconfirm mongo_migrate_app.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mongodb-migrate-${{ matrix.os }}
          path: dist/**

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: executable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # 只发布 dist 顶层产物，避免递归匹配 .app 包内部依赖文件
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/mongodb-migrate
            artifacts/*.spdx.json
            artifacts/*.txt
            artifacts/*.json

